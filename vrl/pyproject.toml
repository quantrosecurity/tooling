[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vrl-cli"
version = "0.1.0"
description = "Command-line client for Vulnerability Research Labs — submit a CVE to the VRL queue, watch it move through the pipeline, and read the result."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Quantro Security" }]
keywords = ["cve", "security", "vulnerability", "exploit", "cli", "vrl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Mint Google OIDC identity tokens in-process (for the privileged /internal plane)
# without shelling out to the `gcloud` CLI. Reads/public-submit need none of this.
auth = ["google-auth>=2.28"]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/quantrosecurity/tooling/tree/main/vrl"
Repository = "https://github.com/quantrosecurity/tooling"
"Live queue" = "https://vrl.quantrosecurity.ai"

[project.scripts]
vrl = "vrl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vrl"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep typing.Optional / Union: Typer evaluates annotations at runtime to build
# the CLI, and `X | None` raises on Python 3.9 (which this package supports) even
# under `from __future__ import annotations`.
ignore = ["UP045", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["vrl"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
